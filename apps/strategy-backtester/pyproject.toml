[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy-backtester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "arblab",
  "numpy",
  "pandas",
  "streamlit",
  "python-dotenv",
]

[tool.uv.sources]
arblab = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_backtester"]
