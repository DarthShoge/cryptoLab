[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kamino-simulator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "arblab",
  "streamlit",
  "python-dotenv",
]

[tool.uv.sources]
arblab = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kamino_simulator"]
