[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperliquid-explorer-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["arblab", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.uv.sources]
arblab = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/hyperliquid_explorer_api"]
