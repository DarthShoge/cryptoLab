[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arblab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "ccxt",
  "numpy",
  "pandas",
  "exchange-calendars>=4.11,<5",
  "anchorpy==0.20.1",
  "solana>=0.33.0",
  "base58",
  "python-dotenv",
  "duckdb==1.5.5",
  "hyperliquid-data==0.1.0",
  "hyperliquid-python-sdk==0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arblab"]
