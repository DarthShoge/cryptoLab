[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arblab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "ccxt",
  "numpy",
  "pandas",
  "anchorpy==0.20.1",
  "solana>=0.33.0",
  "base58",
  "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arblab"]
